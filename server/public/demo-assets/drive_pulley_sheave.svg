<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>
  <rect x="20" y="20" width="560" height="40" fill="#0284c7" opacity="0.15" rx="6"/>
  <text x="40" y="46" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">EVIDENCE PHOTO #104: SECONDARY DRIVE SHEAVE &amp; BELT</text>
  
  <!-- Motor Hub -->
  <circle cx="180" cy="220" r="100" fill="url(#metal)" stroke="#64748b" stroke-width="4"/>
  <circle cx="180" cy="220" r="50" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
  <circle cx="180" cy="220" r="16" fill="#0f172a"/>
  
  <!-- Driven Pulley -->
  <circle cx="440" cy="220" r="75" fill="url(#metal)" stroke="#64748b" stroke-width="4"/>
  <circle cx="440" cy="220" r="35" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
  
  <!-- Belt Profile - Misaligned -->
  <path d="M 180 120 L 440 145 A 75 75 0 0 1 440 295 L 180 320 A 100 100 0 0 1 180 120 Z" fill="none" stroke="#0f172a" stroke-width="24"/>
  <path d="M 180 120 L 440 145 A 75 75 0 0 1 440 295 L 180 320 A 100 100 0 0 1 180 120 Z" fill="none" stroke="#334155" stroke-width="16"/>
  <path d="M 180 120 L 440 145" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Annotation Arrow & Box -->
  <rect x="340" y="80" width="230" height="60" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" rx="6" opacity="0.9"/>
  <text x="355" y="105" fill="#fecaca" font-family="sans-serif" font-weight="bold" font-size="13">[!] AXIAL MISALIGNMENT DETECTED</text>
  <text x="355" y="125" fill="#fca5a5" font-family="sans-serif" font-size="12">Observed Offset: ~3.8mm (Max OEM: 2.0mm)</text>
  
  <!-- Status Badge -->
  <rect x="40" y="340" width="180" height="32" fill="#14532d" stroke="#22c55e" stroke-width="1" rx="16"/>
  <text x="58" y="361" fill="#86efac" font-family="sans-serif" font-weight="bold" font-size="12">TELEMETRY: 1750 RPM</text>
</svg>

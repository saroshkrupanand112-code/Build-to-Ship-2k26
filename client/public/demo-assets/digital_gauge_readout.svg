<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131d33"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#panelGrad)" rx="12"/>
  <rect x="20" y="20" width="560" height="40" fill="#059669" opacity="0.15" rx="6"/>
  <text x="40" y="46" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="16">MAIN HYDRAULIC CONTROL CONSOLE - TELEMETRY SCREEN</text>
  
  <!-- LCD Screen Bezel -->
  <rect x="60" y="90" width="480" height="230" fill="#022c22" stroke="#10b981" stroke-width="3" rx="10"/>
  
  <!-- Digital Temperature Readout -->
  <text x="100" y="150" fill="#10b981" font-family="monospace" font-size="18" letter-spacing="2">OIL RESERVOIR TEMPERATURE</text>
  <text x="100" y="240" fill="#34d399" font-family="monospace" font-weight="bold" font-size="64">41.8 °C</text>
  
  <!-- Status Indicator -->
  <rect x="360" y="195" width="140" height="40" fill="#064e3b" stroke="#34d399" stroke-width="2" rx="6"/>
  <circle cx="380" cy="215" r="8" fill="#22c55e"/>
  <text x="400" y="221" fill="#a7f3d0" font-family="sans-serif" font-weight="bold" font-size="14">NOMINAL</text>
  
  <!-- Temperature Bar Scale -->
  <rect x="100" y="270" width="380" height="16" fill="#065f46" rx="8"/>
  <rect x="100" y="270" width="160" height="16" fill="#10b981" rx="8"/>
  <text x="100" y="305" fill="#6ee7b7" font-family="monospace" font-size="12">20°C</text>
  <text x="240" y="305" fill="#34d399" font-family="monospace" font-weight="bold" font-size="12">41.8°C (CURRENT)</text>
  <text x="440" y="305" fill="#f87171" font-family="monospace" font-size="12">75°C MAX</text>
  
  <!-- Highlight Note -->
  <rect x="60" y="340" width="480" height="35" fill="#78350f" stroke="#f59e0b" stroke-width="1" rx="6" opacity="0.9"/>
  <text x="75" y="362" fill="#fde68a" font-family="sans-serif" font-size="12">⚠️ CROSS-CHECK: Sensor shows 41.8°C. Report claims 'Overheating'. Conflict flagged.</text>
</svg>
